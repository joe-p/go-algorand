[package]
name = "wasm_lsig"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
name = "wasm_lsig"
# staticlib for linking into cgo; rlib so `cargo test` can build the unit tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# `deterministic` and `portable-dispatch` keep execution identical across
# machines, which consensus requires. `std` because algod is a normal process.
# `validate` so invalid modules are rejected at load time.
wasmi = { version = "2.0.0", default-features = false, features = [
    "std",
    "validate",
    "deterministic",
    "portable-dispatch",
] }

[dev-dependencies]
wat = "1.0"
