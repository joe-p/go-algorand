# Guest-side crates for authoring WASM LogicSigs. Kept out of the host
# executor's manifest (`wasm/Cargo.toml`) so `make wasmlib` is unaffected.
[workspace]
resolver = "2"
members = [
    "ed25519-dalek",
    "avm-sys",
    "avm-sdk",
    "avm-sdk-macros",
    "examples/avm-sdk-amm",
    "examples/avm-sdk-arc4-counter",
    "examples/avm-sdk-arc4-resources",
    "examples/avm-sdk-arc4-types",
    "examples/avm-sdk-counter",
    "examples/ed25519-verify",
    "examples/rust-counter",
    "examples/rust-signed-claim",
    "runner",
]

# Replace the crates.io `ed25519-dalek` with our host-backed fork. Guests opt in
# by depending on `ed25519-dalek` as usual; Cargo resolves it to the fork.
[patch.crates-io]
ed25519-dalek = { path = "ed25519-dalek" }

# Guests are compiled to `wasm32-unknown-unknown`; size matters for the program
# byte cap and fuel is charged per instruction, so optimize for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
