[package]
name = "rust-signed-claim"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Representative compiler-generated WASM application: signature-authorized claims with replay-protected global state."

[lib]
name = "rust_signed_claim"
crate-type = ["cdylib", "rlib"]

[dependencies]
avm-sdk = { path = "../../avm-sdk" }
# Resolved to the host-backed fork via [patch.crates-io] in the workspace root.
ed25519-dalek = { version = "2.2", default-features = false }
