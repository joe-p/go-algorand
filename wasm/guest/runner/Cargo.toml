# Host-side test harness: runs committed guest `.wasm` fixtures through the real
# executor (`wasm_lsig`) with a stub ed25519 verifier, so `cargo test` covers
# the guest programs without a Go build.
[package]
name = "avm-sdk-runner"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
name = "avm_sdk_runner"

[dependencies]
wasm_lsig = { path = "../.." }
